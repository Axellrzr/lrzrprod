  <main class="galerie-main">

        <h1 class="galerie-title">Mes vidéos</h1>

    <!-- Filtres -->
    <section class="videos-section">

        <div class="portfolio__filters reveal" role="tablist" aria-label="Filtrer par catégorie">
          <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">Tout</button>
          <button class="filter-btn" data-filter="fpv" role="tab" aria-selected="false">Drone FPV</button>
          <button class="filter-btn" data-filter="pub" role="tab" aria-selected="false">Publicité</button>
          <button class="filter-btn" data-filter="clip" role="tab" aria-selected="false">Clip</button>
          <button class="filter-btn" data-filter="court" role="tab" aria-selected="false">Court-métrage</button>
        </div>

        <!-- Grille vidéos — injectée par JS -->
        <div class="videos-grid" id="videos-grid"></div>
      </div>
    </section>

  </main>

  <!-- Lightbox vidéo -->
  <div class="video-lightbox" id="video-lightbox" hidden>
    <button class="video-lightbox__close" aria-label="Fermer">&times;</button>
    <div class="video-lightbox__inner">
      <iframe id="video-lightbox-iframe" src="" allowfullscreen allow="autoplay; encrypted-media" loading="lazy" title="Vidéo LRZR Production"></iframe>
